<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Freya - Team Dream | 3D Web Arena</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #0b0f19; font-family: 'Segoe UI', system-ui, sans-serif; color: #fff; }
    #canvas-container { position: fixed; inset: 0; touch-action: none; }

    /* HUD Atas */
    .hud-top {
      position: fixed; top: 14px; left: 16px; right: 16px;
      display: flex; justify-content: space-between; align-items: center;
      pointer-events: none; z-index: 10; gap: 10px;
    }
    .hero-badge {
      background: rgba(15, 23, 42, 0.82); backdrop-filter: blur(8px);
      border: 1px solid rgba(56, 189, 248, 0.4); border-radius: 12px;
      padding: 8px 14px; pointer-events: auto;
    }
    .hero-badge h1 { font-size: 14px; font-weight: 700; color: #38bdf8; letter-spacing: 0.5px; }
    .hero-badge p { font-size: 11px; color: #cbd5e1; margin-top: 2px; }

    .upload-btn {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      border: 1px solid rgba(255,255,255,0.25); color: #fff;
      padding: 9px 14px; border-radius: 10px; font-size: 12px; font-weight: 600;
      cursor: pointer; pointer-events: auto; white-space: nowrap;
      box-shadow: 0 4px 14px rgba(37,99,235,0.4);
    }
    .upload-btn:active { transform: scale(0.96); }

    /* Analog Virtual Kiri Bawah */
    #joystick-zone {
      position: fixed; bottom: 26px; left: 26px; width: 130px; height: 130px;
      border-radius: 50%; background: rgba(255, 255, 255, 0.08);
      border: 2px solid rgba(56, 189, 248, 0.45); backdrop-filter: blur(4px);
      touch-action: none; z-index: 20; display: flex; align-items: center; justify-content: center;
    }
    #joystick-knob {
      width: 52px; height: 52px; border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #7dd3fc, #0284c7);
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.7);
      transform: translate(0px, 0px); transition: transform 0.05s linear;
    }

    /* Tombol Skill Kanan Bawah */
    .skills-container {
      position: fixed; bottom: 26px; right: 26px;
      display: flex; gap: 12px; align-items: flex-end; z-index: 20;
    }
    .skill-btn {
      position: relative; width: 64px; height: 64px; border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.35);
      background: rgba(15, 23, 42, 0.85); color: #fff;
      font-weight: 700; cursor: pointer; overflow: hidden;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      box-shadow: 0 6px 18px rgba(0,0,0,0.5); touch-action: manipulation;
    }
    .skill-btn:active { transform: scale(0.92); }
    .skill-btn.ult { width: 78px; height: 78px; border-color: #f59e0b; box-shadow: 0 0 20px rgba(245, 158, 11, 0.45); }
    .skill-key { font-size: 16px; color: #38bdf8; }
    .skill-btn.ult .skill-key { font-size: 20px; color: #fbbf24; }
    .skill-name { font-size: 9px; color: #cbd5e1; margin-top: 2px; }
    .cd-overlay {
      position: absolute; inset: 0; background: rgba(0, 0, 0, 0.72);
      display: none; align-items: center; justify-content: center;
      font-size: 16px; font-weight: 800; color: #fff;
    }

    #loading-toast {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: rgba(15, 23, 42, 0.92); border: 1px solid #38bdf8;
      padding: 14px 22px; border-radius: 12px; font-size: 13px; z-index: 30;
      text-align: center;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="canvas-container"></div>

  <div class="hud-top">
    <div class="hero-badge">
      <h1 id="hero-title">Freya - Team Dream</h1>
      <p id="status-text">Memuat model 3D...</p>
    </div>
    <label class="upload-btn">
      📂 Tes File .GLB
      <input type="file" id="glb-input" accept=".glb,.gltf" hidden />
    </label>
  </div>

  <div id="loading-toast">⏳ Memuat freyadream.glb...</div>

  <div id="joystick-zone"><div id="joystick-knob"></div></div>

  <div class="skills-container">
    <button class="skill-btn" id="btn-q">
      <span class="skill-key">Q</span>
      <span class="skill-name">STRIKE</span>
      <div class="cd-overlay" id="cd-q"></div>
    </button>
    <button class="skill-btn" id="btn-w">
      <span class="skill-key">W</span>
      <span class="skill-name">SHIELD</span>
      <div class="cd-overlay" id="cd-w"></div>
    </button>
    <button class="skill-btn ult" id="btn-r">
      <span class="skill-key">R</span>
      <span class="skill-name">ULTIMATE</span>
      <div class="cd-overlay" id="cd-r"></div>
    </button>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
    import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';

    const DEFAULT_MODEL_URL = './models/freyadream.glb';

    // 1. Setup Scene & Renderer
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b0f19);
    scene.fog = new THREE.FogExp2(0x0b0f19, 0.032);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    container.appendChild(renderer.domElement);

    const hemiLight = new THREE.HemisphereLight(0xdbeafe, 0x1e293b, 1.3);
    scene.add(hemiLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 2.2);
    dirLight.position.set(6, 12, 8);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.set(2048, 2048);
    dirLight.shadow.camera.near = 1;
    dirLight.shadow.camera.far = 35;
    const d = 10;
    dirLight.shadow.camera.left = -d; dirLight.shadow.camera.right = d;
    dirLight.shadow.camera.top = d; dirLight.shadow.camera.bottom = -d;
    scene.add(dirLight);

    // 2. Arena Lantai
    const floor = new THREE.Mesh(
      new THREE.CircleGeometry(24, 64),
      new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 0.7, metalness: 0.2 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    const grid = new THREE.GridHelper(44, 44, 0x38bdf8, 0x1e293b);
    grid.position.y = 0.01;
    scene.add(grid);

    // 3. Loader GLB + Draco + Meshopt
    const dracoLoader = new DRACOLoader();
    dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.7/');
    const gltfLoader = new GLTFLoader();
    gltfLoader.setDRACOLoader(dracoLoader);
    gltfLoader.setMeshoptDecoder(MeshoptDecoder);

    const heroRoot = new THREE.Group();
    scene.add(heroRoot);

    let activeModel = null;
    let mixer = null;
    let actions = { idle: null, run: null, skillQ: null, skillW: null, skillR: null };
    let currentAction = null;
    let isCasting = false;

    function playAction(action, loopOnce = false, timeScale = 1.0) {
      if (!action || currentAction === action) return;
      if (currentAction) currentAction.fadeOut(0.2);
      action.reset();
      action.timeScale = timeScale;
      if (loopOnce) {
        action.setLoop(THREE.LoopOnce, 1);
        action.clampWhenFinished = true;
      } else {
        action.setLoop(THREE.LoopRepeat, Infinity);
      }
      action.fadeIn(0.2).play();
      currentAction = action;
    }

    function buildFallbackHero() {
      const group = new THREE.Group();
      const body = new THREE.Mesh(
        new THREE.CapsuleGeometry(0.32, 0.9, 8, 16),
        new THREE.MeshStandardMaterial({ color: 0x38bdf8, roughness: 0.3 })
      );
      body.position.y = 0.85; body.castShadow = true;
      const head = new THREE.Mesh(
        new THREE.SphereGeometry(0.24, 16, 16),
        new THREE.MeshStandardMaterial({ color: 0xfde68a })
      );
      head.position.y = 1.62; head.castShadow = true;
      group.add(body, head);
      return group;
    }

    function setHeroModel(model, animations = [], label = 'Freya - Team Dream') {
      if (activeModel) heroRoot.remove(activeModel);
      mixer = null;
      actions = { idle: null, run: null, skillQ: null, skillW: null, skillR: null };
      currentAction = null;

      // Auto-scale tinggi karakter ke ~1.8m dan pastikan kaki menapak Y=0
      const box = new THREE.Box3().setFromObject(model);
      const size = box.getSize(new THREE.Vector3());
      const scale = 1.8 / Math.max(size.y, 0.01);
      model.scale.setScalar(scale);

      const scaledBox = new THREE.Box3().setFromObject(model);
      const center = scaledBox.getCenter(new THREE.Vector3());
      model.position.x -= center.x;
      model.position.z -= center.z;
      model.position.y -= scaledBox.min.y;

      model.traverse((child) => {
        if (child.isMesh) {
          child.castShadow = true;
          child.receiveShadow = true;
        }
      });

      heroRoot.add(model);
      activeModel = model;
      document.getElementById('hero-title').textContent = label;

      if (animations.length > 0) {
        mixer = new THREE.AnimationMixer(model);
        const findClip = (keywords) =>
          animations.find((c) => keywords.some((k) => c.name.toLowerCase().includes(k)));

        const idleClip = findClip(['idle', 'stand', 'breath']) || animations[0];
        const runClip  = findClip(['run', 'sprint', 'jog', 'walk']) || animations[Math.min(1, animations.length - 1)];
        const qClip    = findClip(['attack', 'slash', 'punch', 'kick', 'hit']) || animations[0];
        const wClip    = findClip(['shield', 'defend', 'buff', 'cast', 'magic']) || animations[0];
        const rClip    = findClip(['ult', 'special', 'jump', 'dance', 'win']) || qClip;

        actions.idle   = mixer.clipAction(idleClip);
        actions.run    = mixer.clipAction(runClip);
        actions.skillQ = mixer.clipAction(qClip);
        actions.skillW = mixer.clipAction(wClip);
        actions.skillR = mixer.clipAction(rClip);

        mixer.addEventListener('finished', () => {
          isCasting = false;
          playAction(moveMag > 0.1 ? actions.run : actions.idle);
        });

        playAction(actions.idle);
        document.getElementById('status-text').textContent = `✅ ${animations.length} Animasi Aktif • Analog / WASD`;
      } else {
        document.getElementById('status-text').textContent = 'Model Statis (Tanpa Animasi) • Analog / WASD';
      }
    }

    function loadGLBFromURL(url, label) {
      const toast = document.getElementById('loading-toast');
      toast.style.display = 'block';
      toast.textContent = `⏳ Memuat ${label}...`;

      gltfLoader.load(
        url,
        (gltf) => {
          setHeroModel(gltf.scene, gltf.animations, label);
          toast.style.display = 'none';
        },
        (xhr) => {
          if (xhr.total > 0) {
            const pct = Math.round((xhr.loaded / xhr.total) * 100);
            toast.textContent = `⏳ Memuat ${label}... ${pct}%`;
          }
        },
        () => {
          setHeroModel(buildFallbackHero(), [], 'Model Tidak Ditemukan');
          document.getElementById('status-text').textContent = '⚠️ Pastikan file ada di models/freyadream.glb (<25MB)';
          toast.style.display = 'none';
        }
      );
    }

    loadGLBFromURL(DEFAULT_MODEL_URL, 'Freya - Team Dream');

    document.getElementById('glb-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const blobURL = URL.createObjectURL(file);
      loadGLBFromURL(blobURL, file.name.replace(/\.[^/.]+$/, ''));
    });

    // 4. Efek Skill 3D (VFX)
    const activeVFX = [];
    let cameraShake = 0;

    function triggerSkill(type) {
      if (isCasting) return;
      const forward = new THREE.Vector3(0, 0, 1).applyAxisAngle(new THREE.Vector3(0, 1, 0), heroRoot.rotation.y);

      if (type === 'Q') {
        if (actions.skillQ) { isCasting = true; playAction(actions.skillQ, true, 1.3); }
        const slash = new THREE.Mesh(
          new THREE.TorusGeometry(0.95, 0.08, 12, 32, Math.PI * 1.1),
          new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.95 })
        );
        slash.position.copy(heroRoot.position).add(new THREE.Vector3(0, 1.0, 0)).addScaledVector(forward, 0.8);
        slash.rotation.set(Math.PI / 2.3, heroRoot.rotation.y, -Math.PI / 2);
        scene.add(slash);
        activeVFX.push({ mesh: slash, life: 0.55, vel: forward.clone().multiplyScalar(14), grow: 1.8 });
      }

      if (type === 'W') {
        if (actions.skillW) { isCasting = true; playAction(actions.skillW, true, 1.2); }
        const shield = new THREE.Mesh(
          new THREE.SphereGeometry(1.25, 24, 24),
          new THREE.MeshBasicMaterial({ color: 0x34d399, wireframe: true, transparent: true, opacity: 0.65 })
        );
        heroRoot.add(shield);
        shield.position.set(0, 0.95, 0);
        activeVFX.push({ mesh: shield, life: 2.2, spin: 3.0, isChild: true });
      }

      if (type === 'R') {
        if (actions.skillR) { isCasting = true; playAction(actions.skillR, true, 1.1); }
        cameraShake = 0.35;
        const ultGroup = new THREE.Group();
        ultGroup.position.copy(heroRoot.position).addScaledVector(forward, 2.5);

        const ring = new THREE.Mesh(
          new THREE.RingGeometry(1.4, 2.2, 48),
          new THREE.MeshBasicMaterial({ color: 0xfbbf24, side: THREE.DoubleSide, transparent: true, opacity: 0.9 })
        );
        ring.rotation.x = -Math.PI / 2;
        ring.position.y = 0.04;
        ultGroup.add(ring);

        const pillar = new THREE.Mesh(
          new THREE.CylinderGeometry(1.3, 1.6, 7, 32, 1, true),
          new THREE.MeshBasicMaterial({ color: 0xf59e0b, side: THREE.DoubleSide, transparent: true, opacity: 0.45 })
        );
        pillar.position.y = 3.5;
        ultGroup.add(pillar);

        scene.add(ultGroup);
        activeVFX.push({ mesh: ultGroup, life: 1.2, spin: 4.0, grow: 1.3 });
      }
    }

    function bindSkillButton(btnId, cdId, keyChar, cooldownSec) {
      const btn = document.getElementById(btnId);
      const cdEl = document.getElementById(cdId);
      let ready = true;

      const activate = () => {
        if (!ready) return;
        ready = false;
        triggerSkill(keyChar);
        let left = cooldownSec;
        cdEl.style.display = 'flex';
        cdEl.textContent = left.toFixed(1);
        const timer = setInterval(() => {
          left -= 0.1;
          if (left <= 0) {
            clearInterval(timer);
            cdEl.style.display = 'none';
            ready = true;
          } else {
            cdEl.textContent = left.toFixed(1);
          }
        }, 100);
      };
      btn.addEventListener('pointerdown', (e) => { e.stopPropagation(); activate(); });
      return activate;
    }

    const castQ = bindSkillButton('btn-q', 'cd-q', 'Q', 2.0);
    const castW = bindSkillButton('btn-w', 'cd-w', 'W', 4.0);
    const castR = bindSkillButton('btn-r', 'cd-r', 'R', 7.0);

    // 5. Analog Virtual & Keyboard
    const joyZone = document.getElementById('joystick-zone');
    const joyKnob = document.getElementById('joystick-knob');
    let joyInput = { x: 0, y: 0 };
    let joyPointerId = null;

    function updateJoystick(clientX, clientY) {
      const rect = joyZone.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const maxR = rect.width * 0.36;
      let dx = clientX - cx;
      let dy = clientY - cy;
      const dist = Math.hypot(dx, dy);
      if (dist > maxR) {
        dx = (dx / dist) * maxR;
        dy = (dy / dist) * maxR;
      }
      joyKnob.style.transform = `translate(${dx}px, ${dy}px)`;
      joyInput.x = dx / maxR;
      joyInput.y = dy / maxR;
    }

    joyZone.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      joyPointerId = e.pointerId;
      joyZone.setPointerCapture(e.pointerId);
      updateJoystick(e.clientX, e.clientY);
    });
    joyZone.addEventListener('pointermove', (e) => {
      if (e.pointerId === joyPointerId) updateJoystick(e.clientX, e.clientY);
    });
    const resetJoystick = (e) => {
      if (e.pointerId === joyPointerId) {
        joyPointerId = null;
        joyKnob.style.transform = 'translate(0px, 0px)';
        joyInput = { x: 0, y: 0 };
      }
    };
    joyZone.addEventListener('pointerup', resetJoystick);
    joyZone.addEventListener('pointercancel', resetJoystick);

    const keys = {};
    window.addEventListener('keydown', (e) => {
      const k = e.key.toLowerCase();
      keys[k] = true;
      if (k === 'q' || k === '1' || k === 'j') castQ();
      if (k === '2' || k === 'k') castW();
      if (k === '3' || k === 'l' || k === 'r') castR();
    });
    window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

    // 6. Kamera 3rd-Person
    let camYaw = 0;
    let camPitch = 0.42;
    let camDist = 5.2;
    let camDragId = null;
    let lastCamPos = { x: 0, y: 0 };

    renderer.domElement.addEventListener('pointerdown', (e) => {
      camDragId = e.pointerId;
      lastCamPos = { x: e.clientX, y: e.clientY };
    });
    renderer.domElement.addEventListener('pointermove', (e) => {
      if (e.pointerId !== camDragId) return;
      camYaw -= (e.clientX - lastCamPos.x) * 0.007;
      camPitch = Math.max(0.15, Math.min(1.15, camPitch + (e.clientY - lastCamPos.y) * 0.005));
      lastCamPos = { x: e.clientX, y: e.clientY };
    });
    renderer.domElement.addEventListener('pointerup', (e) => { if (e.pointerId === camDragId) camDragId = null; });
    renderer.domElement.addEventListener('wheel', (e) => {
      camDist = Math.max(2.5, Math.min(11, camDist + e.deltaY * 0.004));
    }, { passive: true });

    // 7. Render Loop
    const clock = new THREE.Clock();
    let moveMag = 0;

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);

      let ix = joyInput.x;
      let iy = joyInput.y;
      if (keys['a'] || keys['arrowleft']) ix -= 1;
      if (keys['d'] || keys['arrowright']) ix += 1;
      if (keys['w'] || keys['arrowup']) iy -= 1;
      if (keys['s'] || keys['arrowdown']) iy += 1;

      moveMag = Math.min(1, Math.hypot(ix, iy));

      if (moveMag > 0.08) {
        const angle = Math.atan2(ix, iy) + camYaw;
        const speed = 5.5 * moveMag;
        heroRoot.position.x += Math.sin(angle) * speed * dt;
        heroRoot.position.z += Math.cos(angle) * speed * dt;

        const r = Math.hypot(heroRoot.position.x, heroRoot.position.z);
        if (r > 22) {
          heroRoot.position.x *= 22 / r;
          heroRoot.position.z *= 22 / r;
        }

        let diff = angle - heroRoot.rotation.y;
        while (diff > Math.PI) diff -= Math.PI * 2;
        while (diff < -Math.PI) diff += Math.PI * 2;
        heroRoot.rotation.y += diff * Math.min(1, dt * 12);

        if (!isCasting && actions.run) playAction(actions.run, false, 0.8 + moveMag * 0.4);
      } else {
        if (!isCasting && actions.idle) playAction(actions.idle);
      }

      if (mixer) mixer.update(dt);

      for (let i = activeVFX.length - 1; i >= 0; i--) {
        const v = activeVFX[i];
        v.life -= dt;
        if (v.vel) v.mesh.position.addScaledVector(v.vel, dt);
        if (v.spin) v.mesh.rotation.y += v.spin * dt;
        if (v.grow) v.mesh.scale.addScalar(v.grow * dt);
        if (v.life <= 0) {
          if (v.isChild) heroRoot.remove(v.mesh);
          else scene.remove(v.mesh);
          activeVFX.splice(i, 1);
        }
      }

      const targetPos = new THREE.Vector3(heroRoot.position.x, heroRoot.position.y + 1.15, heroRoot.position.z);
      const cx = targetPos.x + Math.sin(camYaw) * Math.cos(camPitch) * camDist;
      const cy = targetPos.y + Math.sin(camPitch) * camDist;
      const cz = targetPos.z + Math.cos(camYaw) * Math.cos(camPitch) * camDist;

      camera.position.lerp(new THREE.Vector3(cx, cy, cz), Math.min(1, dt * 10));
      if (cameraShake > 0) {
        camera.position.x += (Math.random() - 0.5) * cameraShake;
        camera.position.y += (Math.random() - 0.5) * cameraShake;
        cameraShake = Math.max(0, cameraShake - dt * 1.5);
      }
      camera.lookAt(targetPos);

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
